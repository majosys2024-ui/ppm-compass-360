<style>

<script>
'use strict';
/* =============================================================================================
   Budget Planner – interactive demo. One file, no libraries. State lives in memory (S); every
   action changes S and calls render(). Rules mirror the app (src/utils/*): phases and gates,
   quick start, plan-only tracking, forecasts, contingency, next step, My Tasks.
   ============================================================================================= */

const TODAY = '2026-10';               // demo "now"
const TODAY_ISO = '2026-10-18';
const PEOPLE = {
  alex: 'Alex Morgan', priya: 'Priya Shah', jordan: 'Jordan Lee', marco: 'Marco Rossi', sofia: 'Sofia Keller',
  elena: 'Elena Fischer', tom: 'Tom Becker', anna: 'Dr. Anna Weber', sam: 'Sam Carter', lea: 'Lea Martin'
};
const ROLE_PERSON = { pm: 'alex', owner: 'priya', sponsor: 'jordan' };
const CATS = {
  ExternalServices: 'External labour & services', InternalLabour: 'Internal labour', Hardware: 'Hardware & equipment',
  Software: 'Software & licences', Training: 'Training', Materials: 'Materials & scrap (internal)', Other: 'Other'
};
const METHODS = { Quote: 'Supplier quote / price list', Labour: 'Labour (effort × rate)', Parametric: 'Parametric (quantity × rate)', LumpSum: 'Lump sum', ThreePoint: 'Three-point (PERT)', Expert: 'Expert judgement' };
const GATES = { G1: 'Gate 1 – Approve to plan', G2: 'Gate 2 – Approve baseline', G3: 'Gate 3 – Accept final account', Forecast: 'Forecast', Rebaseline: 'Re-baseline' };
const CONF = { High: [-5, 10], Medium: [-10, 25], Low: [-20, 50] };

/* ---------- month helpers ---------- */
function addM(m, n) { let y = +m.slice(0, 4), mo = +m.slice(5, 7) - 1 + n; y += Math.floor(mo / 12); mo = ((mo % 12) + 12) % 12; return y + '-' + String(mo + 1).padStart(2, '0'); }
function monthsBetween(a, b) { const out = []; for (let m = a; m <= b; m = addM(m, 1)) out.push(m); return out; }
const MN = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
function fmtM(m) { return m ? MN[+m.slice(5, 7) - 1] + ' ' + m.slice(0, 4) : ''; }
function fmtD(d) { if (!d) return ''; const [y, m, dd] = d.split('-'); return MN[+m - 1] + ' ' + (+dd) + ', ' + y; }
function spread(total, months, shape) {
  const n = months.length; if (!n || !total) return {};
  let w = months.map((_, k) => shape === 'front' ? n - k : shape === 'back' ? k + 1 : 1);
  const sw = w.reduce((s, x) => s + x, 0); const out = {}; let given = 0;
  months.forEach((m, k) => { const v = k === n - 1 ? total - given : Math.round(total * w[k] / sw); out[m] = v; given += v; });
  return out;
}
function sumMap(m) { return Object.values(m).reduce((s, v) => s + v, 0); }
function scaleMap(map, total) {
  const ks = Object.keys(map).filter(k => map[k] > 0).sort(); const s = ks.reduce((a, k) => a + map[k], 0);
  if (!ks.length || !s || !total) return {}; const out = {}; let g = 0;
  ks.forEach((k, i) => { const v = i === ks.length - 1 ? total - g : Math.round(total * map[k] / s); out[k] = v; g += v; }); return out;
}
function addMaps(a, b) { const o = { ...a }; for (const k in b) o[k] = (o[k] || 0) + b[k]; return o; }

/* ---------- money ---------- */
let CUR = 'GBP';
function money(v, cur) { return new Intl.NumberFormat('en-GB', { style: 'currency', currency: cur || CUR, maximumFractionDigits: 0 }).format(Math.round(v || 0)); }
function kMoney(v, cur) { const c = cur || CUR; const sym = new Intl.NumberFormat('en-GB', { style: 'currency', currency: c, maximumFractionDigits: 0 }).format(0).replace(/0/g, '').trim(); const a = Math.abs(v); const s = a >= 1e6 ? (a / 1e6).toFixed(2) + 'M' : a >= 1e3 ? (a / 1e3).toFixed(1) + 'K' : String(Math.round(a)); return (v < 0 ? '−' : '') + sym + (sym.length > 1 ? ' ' : '') + s; }
function signed(v) { return !v ? '–' : (v > 0 ? '+' : '−') + money(Math.abs(v)); }
function pct(v) { return (v > 0 ? '+' : '') + Math.round(v) + '%'; }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

/* ---------- sample data ---------- */
let NEXT_ID = 1000;
function it(p, wbs, title, cat, exp, owner, method, amount, from, to, shape, extra) {
  const i = Object.assign({ id: ++NEXT_ID, kind: 'Item', wbs, title, cat, exp, owner, method, amount, from, to, shape: shape || 'even',
    status: 'Accepted', conf: 'Medium', basis: '', spent: 0, remaining: 0, updated: false, lastUpdate: '', closed: false, reason: '', due: '' }, extra || {});
  i.months = i.monthsFixed || spread(i.amount, monthsBetween(i.from, i.to), i.shape);
  p.items.push(i); return i;
}
function pk(p, wbs, title, owner) { p.items.push({ id: ++NEXT_ID, kind: 'Package', wbs, title, owner: owner || '' }); }
function upd(i, spent, remaining, last, reason) { i.spent = spent; i.remaining = remaining; i.updated = true; i.lastUpdate = last || '2026-09-30'; if (reason) i.reason = reason; return i; }
function closeIt(i, final, date, reason) { i.closed = true; i.spent = final; i.remaining = 0; i.updated = true; i.lastUpdate = date; if (reason) i.reason = reason; return i; }
function ver(p, gate, status, likely, o) { const v = Object.assign({ no: p.versions.length + 1, gate, status, likely, low: likely, high: likely, requested: likely, contingency: 0, mr: 0, spent: 0, valueClosed: 0, note: '', by: PEOPLE.alex, date: '2026-01-01', decidedBy: '', decidedDate: '' }, o || {}); p.versions.push(v); return v; }
function log(p, date, what, detail, amount) { p.log.push({ date, what, detail: detail || '', amount: amount || 0, by: PEOPLE.alex }); }

function seed() {
  NEXT_ID = 1000;
  const P = [];
  const base = (o) => Object.assign({ items: [], rom: [], risks: [], assumptions: [], versions: [], log: [], lessons: [], rates: [], contingency: 0, basis: '', mrPct: 5,
    funding: 0, approved: 0, finalCost: 0, roundRequested: '', customCats: [], drawdowns: 0, deputy: '' }, o);

  /* 1. IT — Execution, full lifecycle, actuals, amber */
  const it1 = base({ id: 1, code: 'ERP-26', title: 'ERP finance rollout', currency: 'CHF', phase: 'Execution', mode: 'full', tracking: 'actuals', pm: 'alex', sponsor: 'jordan', deputy: 'marco',

/* ---------- My Tasks ---------- */
function myTasks() {
  const me = ROLE_PERSON[S.role]; const out = { estimates: [], updates: [], reviews: [], decisions: [] };
  S.projects.forEach(p => {
    if (p.phase === 'Planning') items(p).forEach(i => { if (i.owner === me && (i.status === 'Requested' || i.status === 'Returned')) out.estimates.push([p, i]); });
    if (p.phase === 'Execution') accepted(p).forEach(i => { if (i.owner === me && isDue(p, i)) out.updates.push([p, i]); });
    if (p.pm === me && p.phase === 'Planning') items(p).forEach(i => { if (i.status === 'Submitted') out.reviews.push([p, i]); });
    if (p.sponsor === me) p.versions.forEach(v => { if (v.status === 'Submitted') out.decisions.push([p, v]); });
  });
  out.total = out.estimates.length + out.updates.length + out.reviews.length + out.decisions.length;
  return out;
}

function barChart(monthly, width) {

  return sec('Assumptions', 'What the estimate takes for granted. If an assumption turns out wrong, the estimate must be revisited.', 'Assumption') + sec('Exclusions', 'What is deliberately not in this budget, so nobody expects it.', 'Exclusion'); }
function logTab(p) { return `<div class="card"><h3>Budget log</h3><p class="muted" style="margin-top:0">Append-only: every approval, change and overrun with who and when. Nothing is ever deleted.</p><table><thead><tr><th>Date</th><th>What</th><th>Detail</th><th class="num">Amount</th><th>By</th></tr></thead><tbody>
  ${p.log.slice().reverse().map(l => `<tr><td>${fmtD(l.date)}</td><td><b>${esc(l.what)}</b></td><td>${esc(l.detail)}</td><td class="num">${l.amount ? money(l.amount) : ''}</td><td>${l.by}</td></tr>`).join('') || '<tr><td colspan="5" class="empty">No entries yet.</td></tr>'}</tbody></table></div>`; }
function settingsTab(p) {
  const edit = isPmOf(p);
  return `<div class="card"><h3>How this project works</h3><div class="grid2"><div><label class="f">Start</label><div class="radio" style="flex-direction:column;gap:6px">

/* --- Gates & versions --- */
function versionsTab(p) {
  const vs = p.versions.slice().reverse(); if (!vs.length) return '<div class="card"><div class="empty">No versions yet. A version is frozen at each gate and when you save a forecast.</div></div>';
  const isSp = S.role === 'sponsor' && p.sponsor === 'jordan';
  return vs.map(v => { const st = { Approved: 'b-green', Submitted: 'b-amber', Rejected: 'b-red', Superseded: 'b-grey', Saved: 'b-grey' }[v.status];
    const prevBase = p.versions.filter(x => (x.gate === 'G2' || x.gate === 'Rebaseline') && x.no < v.no).pop();
    let figs = '';
    if (v.gate === 'G1') figs = fig('Estimate range', money(v.low) + ' – ' + money(v.high), 'most likely ' + money(v.likely)) + fig('Requested', money(v.requested), 'to plan the project');
    else if (v.gate === 'G2') figs = fig('Cost baseline', money(v.likely), 'range ' + kMoney(v.low) + ' – ' + kMoney(v.high)) + fig('Contingency', money(v.contingency), 'BAC ' + money(v.likely + v.contingency)) + fig('Management reserve', money(v.mr)) + fig('Total budget', money(v.requested), 'incl. management reserve');
    else if (v.gate === 'Forecast') figs = fig('Forecast cost', money(v.likely), prevBase ? signed(v.likely - prevBase.likely) + ' against the baseline' : '') + fig('Spent to date', money(v.spent)) + fig('Contingency left', money(v.contingency)) + fig('Value closed', money(v.valueClosed), 'budget of the items closed');
    else if (v.gate === 'Rebaseline') figs = fig('Cost baseline', money(v.likely), prevBase ? 'was ' + money(prevBase.likely) : '') + fig('Contingency', money(v.contingency)) + fig('Management reserve', money(v.mr)) + fig('Total budget', money(v.requested));
    else figs = fig('Final cost', money(v.likely), prevBase ? signed(v.likely - prevBase.likely) + ' against the baseline' : '') + fig('Contingency released', money(v.contingency));
    return `<div class="card"><div class="pageTitle" style="margin-bottom:6px"><h3 style="margin:0">${GATES[v.gate]} · v${v.no}</h3><span class="badge ${st}">${v.status}</span>${p.baselineNo === v.no ? '<span class="badge b-blue">Current baseline</span>' : ''}<span class="muted">submitted by ${v.by}, ${fmtD(v.date)}</span></div>
    <div class="figures">${figs}</div>${v.note ? `<p class="small"><b>Note:</b> ${esc(v.note)}</p>` : ''}${v.decidedBy ? `<p class="small"><b>${v.status === 'Rejected' ? 'Declined' : 'Approved'} by:</b> ${esc(v.decidedBy)} · ${fmtD(v.decidedDate)}${v.decisionNote ? `<br><b>Comment:</b> ${esc(v.decisionNote)}` : ''}</p>` : ''}
    ${v.status === 'Submitted' ? (isSp ? `<div class="actions"><button class="btn primary" data-a="decide" data-v="${v.no}" data-ok="1">${v.gate === 'G3' ? 'Accept' : 'Approve'}</button><button class="btn" data-a="decide" data-v="${v.no}" data-ok="0">Don't approve</button></div>` : `<p class="hint">Waiting for ${PEOPLE[p.sponsor]}. <button class="link" data-a="viewAs" data-v="sponsor">View as the sponsor to decide →</button></p>`) : ''}
    <div class="actions"><button class="btn small" data-a="toastMsg" data-v="Print gate pack: a one-page, print-ready summary with figures, lines, risks and signature lines (save as PDF from the browser).">Print gate pack</button>${v.gate === 'Forecast' && v.status !== 'Submitted' ? '<button class="btn small" data-a="toastMsg" data-v="Send to Finance: opens a prefilled email with the key figures to the Finance contact set in Settings.">✉ Send to Finance</button>' : ''}</div></div>`; }).join('');
}

/* --- Forecast --- */

    <div class="card tw"><table><thead><tr><th>WBS</th><th>Cost item</th><th>Owner</th><th class="num">Budget</th>${po ? '' : '<th class="num">Planned to date</th><th class="num">Spent</th><th class="num">Still to spend</th>'}<th class="num">${po ? 'Expected total' : 'Forecast'}</th><th class="num">Difference</th><th>Status</th></tr></thead><tbody>
    ${its.map(i => { const f = fc(i); const d = isDue(p, i); return `<tr class="click" tabindex="0" data-a="update" data-p="${p.id}" data-v="${i.id}"><td class="muted">${i.wbs}</td><td><b>${esc(i.title)}</b>${i.reason && f.variance < 0 ? `<div class="hint" style="color:#b45309">${esc(i.reason)}</div>` : ''}</td><td>${i.owner ? PEOPLE[i.owner] : '–'}</td><td class="num">${money(f.budget)}</td>
      ${po ? '' : `<td class="num">${money(plannedBefore(i, TODAY))}</td><td class="num">${f.updated ? money(f.spent) : '–'}</td><td class="num">${f.updated ? money(f.remaining) : '–'}</td>`}<td class="num">${money(f.eac)}</td>
      <td class="num ${f.variance < 0 ? 'up' : f.variance > 0 ? 'down' : ''}">${signed(f.variance)}</td><td>${i.closed ? '<span class="badge b-green">Closed</span>' : d ? '<span class="badge b-amber">Update due</span>' : f.updated ? `<span class="small">${fmtD(i.lastUpdate)}</span>` : '<span class="muted">not yet</span>'}</td></tr>`; }).join('')}</tbody>
    <tfoot><tr><td colspan="3">Total</td><td class="num">${money(s.base)}</td>${po ? '' : `<td class="num">${money(s.ptd)}</td><td class="num">${money(s.spent)}</td><td class="num">${money(s.rem)}</td>`}<td class="num">${money(s.eac)}</td><td class="num ${s.variance < 0 ? 'up' : 'down'}">${signed(s.variance)}</td><td></td></tr></tfoot></table>
    <p class="hint">Click an item to update it. ${po ? 'Plan only: owners keep the expected total current and give the final cost when an item is finished.' : 'Not updated yet = forecast as planned. Owners\' updates appear here as soon as they save.'}</p></div>
    <div class="card"><h3>Baseline vs forecast over time</h3>${lineChart(s.bm, s.fm)}</div>`;

/* --- Close-out --- */
function closeoutTab(p) {

  a.its.forEach(x => { const k = catLabel(x.i.cat); cats[k] = cats[k] || { b: 0, f: 0 }; cats[k].b += x.budget; cats[k].f += x.final; });
  const acc = []; const g1 = p.versions.find(v => v.gate === 'G1' && v.status === 'Approved'); const g2 = p.versions.find(v => v.gate === 'G2'); const lf = p.versions.filter(v => v.gate === 'Forecast').pop();

  ${a.its.map(x => `<tr class="click" tabindex="0" data-a="update" data-p="${p.id}" data-v="${x.i.id}"><td class="muted">${x.i.wbs}</td><td><b>${esc(x.i.title)}</b></td><td class="num">${money(x.budget)}</td><td class="num">${money(x.final)}</td><td class="num ${x.variance < 0 ? 'up' : x.variance > 0 ? 'down' : ''}">${signed(x.variance)}</td><td class="small">${esc(x.reason)}</td><td>${x.closed ? '<span class="badge b-green">Closed</span>' : '<span class="badge b-amber">Open</span>'}</td></tr>`).join('')}</tbody>
  <tfoot><tr><td colspan="2">Total</td><td class="num">${money(a.base)}</td><td class="num">${money(a.final)}</td><td class="num ${a.variance < 0 ? 'up' : 'down'}">${signed(a.variance)}</td><td colspan="2"></td></tr></tfoot></table></div>
  <div class="grid2"><div class="card"><h3>By category</h3><table><thead><tr><th></th><th class="num">Budget</th><th class="num">Final</th><th class="num">Difference</th></tr></thead><tbody>${Object.keys(cats).map(k => `<tr><td>${esc(k)}</td><td class="num">${money(cats[k].b)}</td><td class="num">${money(cats[k].f)}</td><td class="num ${cats[k].b - cats[k].f < 0 ? 'up' : cats[k].b - cats[k].f > 0 ? 'down' : ''}">${signed(cats[k].b - cats[k].f)}</td></tr>`).join('')}</tbody></table></div>

  <p class="hint">Typical targets: rough estimate within −25%/+75%, baseline within −5%/+10%.</p></div></div>
  <div class="card"><h3>Lessons learned</h3><p class="muted" style="margin-top:0">What would help the next project estimate and control its budget better?</p>${p.lessons.map(l => `<div style="padding:6px 0;border-bottom:1px solid #f0f2f5"><b>${esc(l.title)}</b><div class="small">${esc(l.detail)}</div><div class="hint">${l.by} · ${fmtD(l.date)}</div></div>`).join('') || '<div class="empty">None yet.</div>'}
  ${isPmOf(p) ? '<div class="actions"><input class="i" id="lesson" placeholder="e.g. Ask suppliers for quotes before Gate 2" style="max-width:420px"><button class="btn primary" data-a="addLesson">Add lesson</button></div>' : ''}</div>`;
}

/* ---------- panels ---------- */
function panel() {
  const p = S.projects.find(x => x.id === S.panel.pid); CUR = p.currency; const i = p.items.find(x => x.id === S.panel.iid);
  return `<div class="overlay" data-a="closePanel"></div><aside class="panel" role="dialog" aria-label="${esc(i.title)}">${S.panel.kind === 'update' ? updatePanel(p, i) : itemPanel(p, i)}</aside>`;
}
function itemPanel(p, i) {
  const me = ROLE_PERSON[S.role]; const isPm = isPmOf(p); const isOwner = i.owner === me && S.role === 'owner';
  const editable = p.phase === 'Planning' && !pending(p, 'G2') && ((isPm && (i.status === 'Draft' || i.status === 'Returned' || (i.owner === 'alex'))) || (isOwner && (i.status === 'Requested' || i.status === 'Returned')));
  const d = S.panel.draft || (S.panel.draft = { amount: i.amount, method: i.method, conf: i.conf, basis: i.basis, shape: i.shape, owner: i.owner });
  const b = CONF[d.conf] || CONF.Medium; const months = monthsBetween(i.from, i.to); const pv = spread(+d.amount || 0, months, d.shape);
  const dis = editable ? '' : 'disabled';

  <div class="body"><div class="sec">What</div><div class="form"><div class="full"><label class="f">Cost item</label><input class="i" value="${esc(i.title)}" disabled></div>
    <div><label class="f">WBS</label><input class="i" value="${i.wbs}" disabled></div><div><label class="f">Category</label><input class="i" value="${esc(catLabel(i.cat))}" disabled></div></div>
  <div class="sec">Who and when</div><div class="form"><div><label class="f">Owner</label><select class="i" id="d_owner" ${isPm && editable ? '' : 'disabled'}><option value="">– you estimate it yourself –</option>${Object.keys(PEOPLE).map(k => `<option value="${k}" ${d.owner === k ? 'selected' : ''}>${PEOPLE[k]}</option>`).join('')}</select></div>
    <div><label class="f">From – to</label><input class="i" value="${fmtM(i.from)} – ${fmtM(i.to)}" disabled></div></div>
  <div class="sec">Estimate</div><div class="form"><div><label class="f">Method</label><select class="i" id="d_method" ${dis}>${Object.keys(METHODS).filter(k => k !== 'Expert').map(k => `<option value="${k}" ${d.method === k ? 'selected' : ''}>${METHODS[k]}</option>`).join('')}</select></div>
    <div><label class="f">Amount (${p.currency})</label><input class="i" id="d_amount" inputmode="numeric" value="${d.amount || ''}" ${dis}></div>
    <div class="full"><label class="f">How sure are you?</label><div class="radio">${['High', 'Medium', 'Low'].map(c => `<label><input type="radio" name="d_conf" value="${c}" ${d.conf === c ? 'checked' : ''} ${dis} data-a="draftConf"> ${c}</label>`).join('')}</div></div>
    <div class="full"><div class="fig" style="max-width:240px"><span>This estimate</span><b>${money(+d.amount || 0)}</b><small>${money((+d.amount || 0) * (1 + b[0] / 100))} – ${money((+d.amount || 0) * (1 + b[1] / 100))}</small></div></div>
    <div class="full"><label class="f">Basis of estimate *</label><textarea class="i" id="d_basis" ${dis} placeholder="How you arrived at the figure: assumptions, quotes, references.">${esc(d.basis)}</textarea></div></div>
  <div class="sec">When the money is spent</div><div class="radio">${[['even', 'Even'], ['front', 'Front-loaded'], ['back', 'Back-loaded']].map(x => `<label><input type="radio" name="d_shape" value="${x[0]}" ${d.shape === x[0] ? 'checked' : ''} ${dis} data-a="draftShape"> ${x[1]}</label>`).join('')}</div>
  <div class="tw" style="margin-top:8px"><table><thead><tr>${months.slice(0, 12).map(m => `<th class="num">${fmtM(m)}</th>`).join('')}</tr></thead><tbody><tr>${months.slice(0, 12).map(m => `<td class="num">${money(pv[m] || 0)}</td>`).join('')}</tr></tbody></table>${months.length > 12 ? `<p class="hint">… and ${months.length - 12} more months.</p>` : ''}</div>
  ${!editable && p.phase === 'Planning' && i.status === 'Submitted' && !isPm ? '<p class="warnBox">Submitted: locked unless the PM returns it.</p>' : ''}</div>
  <footer>${itemButtons(p, i, isPm, isOwner, editable)}<button class="btn" data-a="closePanel">Close</button></footer>`;
}
function itemButtons(p, i, isPm, isOwner, editable) {
  if (p.phase !== 'Planning' || pending(p, 'G2')) return '';
  if (isPm && i.status === 'Submitted') return '<button class="btn primary" data-a="accept">Accept</button><button class="btn" data-a="return">Return to owner</button>';
  if (isOwner && editable) return '<button class="btn primary" data-a="submitEst">Submit estimate</button><button class="btn" data-a="saveDraft">Save</button>';
  if (isPm && editable) return '<button class="btn primary" data-a="saveAccept">Save and accept</button><button class="btn" data-a="saveDraft">Save</button>';
  return '';
}
function updatePanel(p, i) {
  const f = fc(i); const po = plan(p); const me = ROLE_PERSON[S.role];
  const canEdit = p.phase === 'Execution' && !i.closed && (isPmOf(p) || i.owner === me);
  const d = S.panel.draft || (S.panel.draft = { spent: f.spent, remaining: f.remaining, total: f.eac, confirm: false, reason: '', ask: false });
  const eac = po ? +d.total : (+d.spent) + (+d.remaining); const variance = f.budget - eac;
  const months = Object.keys(addMaps(i.months, itemMonthly(i))).sort(); const fm = itemMonthly(i);
  return `<header><div><h2>${esc(i.title)}</h2><div class="tags">${i.closed ? '<span class="badge b-green">Closed</span>' : isDue(p, i) ? '<span class="badge b-amber">Update due</span>' : ''}${i.owner ? `<span class="chip">Owner: ${PEOPLE[i.owner]}</span>` : ''}<span class="chip">${i.lastUpdate ? 'updated ' + fmtD(i.lastUpdate) : 'not updated yet'}</span><span class="chip">${po ? '🗓️ Plan only' : '📊 Actual spend'}</span></div></div><button class="x" data-a="closePanel" aria-label="Close">×</button></header>
  <div class="body"><div class="figBlocks" style="margin:6px 0 4px">${fb('Budget', money(f.budget), 'blue')}${po ? '' : fb('Planned to date', money(plannedBefore(i, TODAY)))}${!po || i.closed ? fb(po ? 'Final cost' : 'Spent', money(f.spent)) : ''}${fb(po && !i.closed ? 'Expected total' : 'Forecast', money(f.eac), f.variance < 0 ? 'red' : f.updated ? 'green' : '')}</div>
  ${canEdit ? `<div class="sec">One-click update</div><div class="quick">
    <button class="qb" data-a="quick" data-v="onPlan"><b>${po ? 'Plan still right' : 'On plan'}</b><span>${po ? 'Expected total stays ' + money(f.eac) : 'Spent ' + money(Math.max(f.spent, plannedBefore(i, TODAY))) + ' as planned'}</span></button>

    <button class="qb ${d.confirm ? 'warn' : ''}" data-a="quick" data-v="close"><b>${d.confirm ? 'Click again to close' : 'Finished – close'}</b><span>Final cost = ${money(po ? +d.total : +d.spent)}</span></button></div>

  <div class="sec">By month</div><div class="tw"><table><thead><tr><th></th>${months.slice(-12).map(m => `<th class="num">${fmtM(m)}</th>`).join('')}</tr></thead><tbody>

  } else if (m.kind === 'paste') {
    h = `<h2>Paste list</h2><p class="muted">Paste lines from Excel or any list: [WBS] Title [Category] [Opex/Capex]. “5” makes a work package, “5.1” a cost item in it. New category names become project categories.</p>

  Object.assign(i, { amount: +d.amount || 0, method: d.method, conf: d.conf, basis: d.basis, shape: d.shape, owner: d.owner }); i.months = spread(i.amount, monthsBetween(i.from, i.to), i.shape); return i; }
function applyUpdate(p, i, spent, rem, close) {
  const d = S.panel.draft; const before = fc(i); const newEac = spent + (close ? 0 : rem);
  if (newEac > before.budget && newEac > before.eac && !d.reason) { d.ask = true; if (plan(p)) d.total = newEac; else { d.spent = spent; d.remaining = close ? 0 : rem; } d.confirm = close; toast('Over budget: please say why.'); return; }
  i.spent = spent; i.remaining = close ? 0 : rem; i.updated = true; i.lastUpdate = TODAY_ISO; if (d.reason) { i.reason = d.reason; log(p, TODAY_ISO, 'Overrun reported', i.wbs + ' ' + i.title + ': ' + d.reason, newEac - before.budget); }
  if (close) { i.closed = true; log(p, TODAY_ISO, 'Item closed', i.wbs + ' ' + i.title, spent); }
  S.panel = null; const s = control(p);
  toast((close ? 'Closed at ' + money(spent, p.currency) + '. ' : 'Saved. ') + 'Project forecast ' + money(s.eac, p.currency) + ' — ' + s.rag + '.');
}
function decide(p, v, ok, note) {
  v.status = ok ? 'Approved' : 'Rejected'; v.decidedBy = pmApproves(p) && !p.sponsor ? PEOPLE.alex + ' (project manager, quick start)' : PEOPLE.jordan; v.decidedDate = TODAY_ISO; v.decisionNote = note;
  if (ok) {
    if (v.gate === 'G1') p.phase = 'Planning';
    if (v.gate === 'G2' || v.gate === 'Rebaseline') { const prev = p.versions.find(x => x.no === p.baselineNo); if (prev && prev !== v) prev.status = 'Superseded'; p.approved = v.requested; p.baselineNo = v.no; if (v.gate === 'G2') p.phase = 'Execution';
      if (v.gate === 'Rebaseline') accepted(p).forEach(i => { const f = fc(i); i.amount = f.eac; }); }
    if (v.gate === 'G3') { p.phase = 'Closed'; p.finalCost = v.likely; }
  }
  log(p, TODAY_ISO, (ok ? 'Approved: ' : 'Declined: ') + GATES[v.gate] + ' v' + v.no, note || '', v.requested);
}

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]'); if (!el) { if (S.more) { S.more = false; render(); } return; }
  const a = el.dataset.a; if (a === 'setMode' || a === 'setTracking' || a === 'draftConf' || a === 'draftShape') return; // handled on change
  if (!A[a]) return; e.preventDefault();
  if (S.panel && S.panel.kind === 'item' && a !== 'closePanel') readItemDraft();
  A[a](el.dataset.v, el); render();
});
document.addEventListener('change', e => {
  const el = e.target; if (el.id === 'roleSel') { S.role = el.value; S.panel = null; render(); toast('Now viewing as ' + PEOPLE[ROLE_PERSON[S.role]] + '.'); return; }
  const a = el.dataset && el.dataset.a; if (a && A[a]) { A[a](el.value, el); render(); }
});
document.addEventListener('input', e => {
  if (e.target.id === 'q') { S.q = e.target.value; const pos = e.target.selectionStart; render(); const q = document.getElementById('q'); q.focus(); q.setSelectionRange(pos, pos); }
  if (S.panel && S.panel.kind === 'update' && /^u_/.test(e.target.id)) { readUpdateDraft(); const id = e.target.id, pos = e.target.selectionStart; render(); const el = document.getElementById(id); if (el) { el.focus(); try { el.setSelectionRange(pos, pos); } catch (x) {} } }
  if (S.panel && S.panel.kind === 'item' && e.target.id === 'd_amount') { readItemDraft(); const pos = e.target.selectionStart; render(); const el = document.getElementById('d_amount'); el.focus(); try { el.setSelectionRange(pos, pos); } catch (x) {} }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') { if (S.modal) S.modal = null; else if (S.panel) S.panel = null; else S.more = false; render(); }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('tr[data-a]')) { e.preventDefault(); e.target.click(); } });

reset(); render();
</script>
